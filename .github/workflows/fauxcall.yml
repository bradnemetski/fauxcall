# Generated by FauxCall. Lints, type-checks and tests every fake (offline; no real API calls).
name: fauxcall fakes

on:
  push:
  pull_request:

jobs:
  fake:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fake: ["frankfurter", "refapi", "timeapi"]
    defaults:
      run:
        working-directory: examples/fauxcall/${{ matrix.fake }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing
