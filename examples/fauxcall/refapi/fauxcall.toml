# Runtime settings of the FauxCall Reference Market API fake (overridden by .env and FAUXCALL_* variables).
name = "refapi"
port = 8702

# Exactly the keys the real API documents (OpenAPI info.description and ApiKeyAuth): any other key
# gets 401 invalid_api_key. Test runs add the harness's own placeholder key (settings_for_tests).
[auth]
mode = "allowlist"

[[auth.users]]
name = "demo"
api_key = "demo-key"          # documented: full access

[[auth.users]]
name = "readonly"
api_key = "readonly-key"      # documented: GET only -> 403 read_only_key on writes
scopes = ["read"]

[[auth.users]]
name = "revoked"
api_key = "revoked-key"       # documented: always 403 api_key_revoked
status = "denied"
